name: Release

# Release tags (vX.Y.Z) track the Sparky Cart PRODUCT version in the root
# package.json; frontend/backend/microservice carry their own versions.
on:
  push:
    tags: ["v*"]
  # Manual re-run for an existing tag (e.g. after a transient CI failure).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v3.5.0"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "23.6.0"

jobs:
  build-release:
    name: Build Windows release bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags: the changelog step diffs against the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Derive version from tag
        id: ver
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Fail fast if the tag doesn't match the product version being released.
      - name: Check tag matches product version
        id: comp
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          product=$(node -p "require('./package.json').version")
          if [ "$product" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION does not match the product version $product in package.json"
            exit 1
          fi
          for c in frontend backend microservice; do
            echo "$c=$(node -p "require('./$c/package.json').version")" >> "$GITHUB_OUTPUT"
          done

      # Run the test suites before packaging (fail the release if red).
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
        env:
          NODE_ENV: test
      - name: Microservice tests
        working-directory: microservice
        run: npm ci && npm test
        env:
          PLC_MODE: sim

      # Build the frontend into backend/src/public. --include=dev guards
      # against npm's `omit` config silently defaulting to ["dev"] if
      # NODE_ENV=production is ever set in this job (it would skip
      # vite/@vitejs/plugin-react and fail the build for lack of the vite
      # binary — see sparky.bat's :build for the same guard).
      - name: Build frontend
        working-directory: frontend
        run: npm ci --include=dev && npm run build

      # Production dependencies WITH native win-x64 prebuilds (better-sqlite3),
      # so the edge device does not need a compiler.
      - name: Install production deps (backend)
        working-directory: backend
        run: npm ci --omit=dev
      - name: Install production deps (microservice)
        working-directory: microservice
        run: npm ci --omit=dev

      - name: Stage and package bundle
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $stage = "staging/sparky-app"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # App code + built UI + prod node_modules (exclude the portable runtime;
          # it already lives on the device and is not part of an update).
          Copy-Item backend      $stage/backend      -Recurse
          Copy-Item microservice $stage/microservice -Recurse
          Copy-Item deploy       $stage/deploy       -Recurse
          Copy-Item sparky.bat   $stage/sparky.bat
          Copy-Item README.md    $stage/README.md
          Copy-Item package.json $stage/package.json
          # Drop any local env/db that may have leaked into the tree.
          Get-ChildItem -Recurse -Path $stage -Include *.sqlite,.env -Force -ErrorAction SilentlyContinue | Remove-Item -Force

          $zip = "sparky-app-$ver.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $components = @{
            frontend     = "${{ steps.comp.outputs.frontend }}"
            backend      = "${{ steps.comp.outputs.backend }}"
            microservice = "${{ steps.comp.outputs.microservice }}"
          }
          @{ version = $ver; asset = $zip; sha256 = $sha; components = $components } | ConvertTo-Json | Out-File -Encoding utf8 manifest.json
          echo "zip=$zip"  >> $env:GITHUB_OUTPUT
          echo "sha=$sha"  >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $zip ($sha)"

      # Changelog for the release notes, generated from conventional commits
      # between the previous release tag and this one (git-cliff, pinned).
      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${TAG}~1" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          echo "Changelog range: $range"
          curl -sL -o git-cliff.zip \
            "https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-pc-windows-msvc.zip"
          unzip -o -j git-cliff.zip -d "$RUNNER_TEMP/git-cliff" > /dev/null
          cliff=$(find "$RUNNER_TEMP/git-cliff" -name "git-cliff.exe" | head -1)
          "$cliff" --strip header "$range" > changelog.md
          {
            echo "notes<<EOF"
            cat changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sparky Cart ${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.pkg.outputs.zip }}
            manifest.json
          body: |
            Automated release of Sparky Cart ${{ steps.ver.outputs.version }}.

            ## What's changed

            ${{ steps.changelog.outputs.notes }}

            | Component | Version |
            | --- | --- |
            | Frontend | ${{ steps.comp.outputs.frontend }} |
            | Backend | ${{ steps.comp.outputs.backend }} |
            | PLC bridge (microservice) | ${{ steps.comp.outputs.microservice }} |

            SHA-256: `${{ steps.pkg.outputs.sha }}`

            Apply on the edge device with `deploy\update.bat` (checksum-verified,
            with rollback), or download `sparky-app-${{ steps.ver.outputs.version }}.zip` manually.
