# /etc/wsl.conf for the sparky-host distro (#25).
[boot]
# systemd starts docker.service when the distro starts.
systemd=true

[automount]
# /mnt/c files owned by uid 1000 (the image's node user) so app containers
# can write daily backups to C:\SparkyData\backups.
options = "metadata,uid=1000,gid=1000,umask=022"

[time]
# /etc/localtime follows the Windows time zone; setup-host.sh derives
# SPARKY_TZ from it.
useWindowsTimezone=true
